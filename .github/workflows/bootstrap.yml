name: Bootstrap SPACE v0.2

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack project zip if present
        run: |
          if [ -f space-browser-v0.2.zip ]; then
            unzip -o -q space-browser-v0.2.zip
            cp -r space/. .
            rm -rf space space-browser-v0.2.zip
            echo "Unpacked the zip into the repo."
          else
            echo "No zip found; assuming the source is already unpacked."
          fi
          if [ ! -f settings.gradle.kts ]; then
            echo "::error::No project files found - neither zip nor source."
            exit 1
          fi

      - name: Write reliable build workflow
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/build.yml << 'YML'
          name: Build APK

          on:
            push:
            workflow_dispatch:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Check out the code
                  uses: actions/checkout@v4

                - name: Set up JDK 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"

                - name: Ensure Android SDK
                  run: |
                    if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-/nope}" ]; then
                      echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
                      export ANDROID_HOME="$HOME/android-sdk"
                    fi
                    SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
                    if [ ! -x "$SDKM" ]; then
                      mkdir -p "$ANDROID_HOME/cmdline-tools"
                      curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
                      unzip -q /tmp/clt.zip -d /tmp/clt
                      rm -rf "$ANDROID_HOME/cmdline-tools/latest"
                      mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
                    fi
                    yes | "$SDKM" --licenses > /dev/null 2>&1 || true
                    "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

                - name: Set up Gradle 8.4
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: "8.4"

                - name: Build debug APK
                  run: gradle assembleDebug --stacktrace 2>&1 | tee build-log.txt

                - name: Build log on failure
                  if: failure()
                  run: |
                    echo "## Build log (last part)" >> "$GITHUB_STEP_SUMMARY"
                    tail -c 60000 build-log.txt >> "$GITHUB_STEP_SUMMARY"

                - name: Upload the APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: SPACE-debug-apk
                    path: app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error
          YML

      - name: Commit source to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git commit -m "Unpack SPACE v0.2 source"; then
            if git push; then
              echo "Source pushed to the repo."
            else
              echo "::warning::Could not push the source. Building the APK anyway."
            fi
          else
            echo "Nothing new to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-/nope}" ]; then
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME="$HOME/android-sdk"
          fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Build log on failure
        if: failure()
        run: |
          echo "## Build log (last part)" >> "$GITHUB_STEP_SUMMARY"
          tail -c 60000 build-log.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPACE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
