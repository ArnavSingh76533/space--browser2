name: Bootstrap SPACE v0.2

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          if [ -f space-browser-v0.2.zip ]; then
            unzip -o space-browser-v0.2.zip
            cp -r space/. .
            rm -rf space space-browser-v0.2.zip
          fi

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack SPACE v0.2 source" || echo "nothing new"
          git push || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Build log on failure
        if: failure()
        run: |
          echo "## Build log (last part)" >> $GITHUB_STEP_SUMMARY
          tail -c 60000 build-log.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPACE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
